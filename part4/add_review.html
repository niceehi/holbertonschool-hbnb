<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBnB - Add Review</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
</head>

<body>

<header class="site-header">

    <a href="index.html">
        <img
            src="images/logo.png"
            alt="HBnB logo"
            class="logo"
        >
    </a>

    <nav class="navigation">
        <a href="index.html">Places</a>

        <a
            href="login.html"
            id="login-link"
            class="login-button"
        >
            Login
        </a>
    </nav>

</header>

<main class="form-page">

    <section class="form-container">

        <h1>Add a Review</h1>

        <form
            id="review-form"
            class="form"
        >

            <div class="form-group">

                <label for="rating">
                    Rating
                </label>

                <select
                    id="rating"
                    name="rating"
                    required
                >
                    <option value="">
                        Select a rating
                    </option>

                    <option value="1">
                        1 - Poor
                    </option>

                    <option value="2">
                        2 - Fair
                    </option>

                    <option value="3">
                        3 - Good
                    </option>

                    <option value="4">
                        4 - Very Good
                    </option>

                    <option value="5">
                        5 - Excellent
                    </option>
                </select>

            </div>

            <div class="form-group">

                <label for="comment">
                    Comment
                </label>

                <textarea
                    id="comment"
                    name="comment"
                    rows="6"
                    placeholder="Write your review..."
                    required
                ></textarea>

            </div>

            <p
                id="review-message"
                class="error-message"
            ></p>

            <button
                type="submit"
                class="submit-button"
            >
                Submit Review
            </button>

        </form>

    </section>

</main>

<footer class="site-footer">
    <p>&copy; 2026 HBnB. All rights reserved.</p>
</footer>

<script src="scripts.js"></script>

</body>
</html>
