```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
</head>

<body>

<header class="site-header">
    <a href="index.html">
        <img
            src="images/logo.png"
            alt="HBnB logo"
            class="logo"
        >
    </a>

    <nav class="navigation">
        <a href="index.html">Places</a>

        <a
            href="login.html"
            id="login-link"
            class="login-button"
        >
            Login
        </a>
    </nav>
</header>

<main>

    <section class="hero">
        <h1>Find your perfect place</h1>
        <p>Discover comfortable places for your next stay.</p>
    </section>

    <section class="filter-section">
        <label for="price-filter">Maximum price:</label>

        <select id="price-filter">
            <option value="10">10</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="all" selected>All</option>
        </select>
    </section>

    <section class="places-section">
        <h2>Available Places</h2>

        <div id="places-list" class="places-container">
            <!-- Places are loaded dynamically -->
        </div>
    </section>

</main>

<footer class="site-footer">
    <p>&copy; 2026 HBnB. All rights reserved.</p>
</footer>

<script src="scripts.js"></script>

</body>
</html>
